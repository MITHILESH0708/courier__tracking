<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Courier Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between;">
            <h1>Courier Dashboard</h1>
            <button class="btn-secondary" onclick="logout()" style="width: 100px;">Logout</button>
        </div>
        
        <h3>My Active Orders</h3>
        <table id="orders-table">
            <thead>
                <tr>
                    <th>Tracking ID</th>
                    <th>Pickup</th>
                    <th>Drop</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/api.js"></script>
    <script src="js/courier.js"></script>
</body>
</html>
